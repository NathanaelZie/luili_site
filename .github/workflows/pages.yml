# Publie le site statique sur GitHub Pages à chaque push sur main.
# Prérequis (une fois) : Settings > Pages > Source : « GitHub Actions ».
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Même version que le poste de dev : pubspec.lock exige Dart < 3.14.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7

      - run: dart pub get

      - id: pages
        uses: actions/configure-pages@v5

      # base_path vaut « /luili_site » pour un dépôt de projet, « » pour un domaine propre.
      - name: Export statique
        run: >
          dart run tool/export_static.dart
          --base "${{ steps.pages.outputs.base_path }}/"
          --url "${{ steps.pages.outputs.base_url }}"
          --out build/pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
